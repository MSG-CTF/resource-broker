map $ssl_client_s_dn $agent_resource_target_id {
    default "";
    "~^CN=(?<agent_resource_target_uuid>[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$" $agent_resource_target_uuid;
}

limit_req_zone $binary_remote_addr zone=agent_enrollment_per_ip:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;

    server_name broker.mjsec.kr agents.mjsec.kr;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name broker.mjsec.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/msg-broker-gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msg-broker-gateway/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MSG_BROKER_SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Agent-Cert-Verify "";
        proxy_set_header X-Agent-Cert-Fingerprint "";
        proxy_set_header X-Agent-Resource-Target-ID "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name agents.mjsec.kr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/msg-broker-gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msg-broker-gateway/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MSG_AGENT_SSL:10m;
    ssl_session_tickets off;

    ssl_client_certificate /etc/msg-broker/pki/agent-ca/client-trust-chain.crt;
    ssl_crl /etc/msg-broker/pki/agent-ca/crl/agent-ca-bundle.crl;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    client_max_body_size 1m;

    location = /v1/agent/observations {
        if ($ssl_client_verify != SUCCESS) {
            return 401;
        }

        if ($agent_resource_target_id = "") {
            return 403;
        }

        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/_agent/v1/agent/observations;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Agent-Cert-Verify $ssl_client_verify;
        proxy_set_header X-Agent-Cert-Fingerprint $ssl_client_fingerprint;
        proxy_set_header X-Agent-Resource-Target-ID $agent_resource_target_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /v1/agent/enrollments {
        limit_req zone=agent_enrollment_per_ip burst=50 nodelay;
        limit_req_status 429;

        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/_agent/v1/agent/enrollments;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Agent-Cert-Verify "";
        proxy_set_header X-Agent-Cert-Fingerprint "";
        proxy_set_header X-Agent-Resource-Target-ID "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/agent/bootstrap-enrollments/[0-9a-fA-F-]{36}$ {
        limit_req zone=agent_enrollment_per_ip burst=50 nodelay;
        limit_req_status 429;

        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/_agent$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Agent-Cert-Verify "";
        proxy_set_header X-Agent-Cert-Fingerprint "";
        proxy_set_header X-Agent-Resource-Target-ID "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/v1/agent/bootstrap-artifacts/msg-broker-node-agent-bootstrap-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/_agent$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/v1/agent/bootstrap-jobs/[0-9a-fA-F-]{36}/runner\.sh$ {
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:8080/_agent$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
