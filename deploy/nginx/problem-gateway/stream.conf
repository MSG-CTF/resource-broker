# shortcut: temporary self-signed certificate until public DNS validation is configured.
ssl_certificate /etc/nginx/tls/msgctf-gateway/fullchain.pem;
ssl_certificate_key /etc/nginx/tls/msgctf-gateway/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_handshake_timeout 10s;
ssl_session_cache shared:MSGCTF:10m;
ssl_session_timeout 10m;
ssl_session_tickets off;
proxy_connect_timeout 5s;
proxy_timeout 1h;

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return "";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gate.msgctf.kr;
    proxy_pass 127.0.0.1:8080;
}
