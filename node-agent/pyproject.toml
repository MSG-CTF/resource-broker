[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-broker-node-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kubernetes==36.0.3",
]

[project.scripts]
msg-broker-node-agent = "msg_broker_node_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
