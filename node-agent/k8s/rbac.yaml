apiVersion: v1
kind: Namespace
metadata:
  name: msg-broker-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: msg-broker-node-agent
  namespace: msg-broker-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: msg-broker-node-agent
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: msg-broker-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: msg-broker-node-agent
subjects:
  - kind: ServiceAccount
    name: msg-broker-node-agent
    namespace: msg-broker-system
