server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://app:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The current HTTP-only proxy must never trust client-supplied mTLS
        # identity headers. The future TLS gateway will overwrite these from
        # verified client-certificate values for /v1/agent/*.
        proxy_set_header X-Agent-Cert-Verify "";
        proxy_set_header X-Agent-Cert-Fingerprint "";
        proxy_set_header X-Agent-Resource-Target-ID "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
