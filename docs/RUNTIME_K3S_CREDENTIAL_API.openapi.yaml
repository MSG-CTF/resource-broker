openapi: 3.1.0
info:
  title: MSG Broker Runtime k3s Credential API
  version: 1.0.0
  description: >-
    Runtime-only API for retrieving the latest encrypted-at-rest k3s
    kubeconfig associated with an enabled Broker resource target. The response
    contains administrator credentials and must never be logged or exposed to
    an end user.
servers:
  - url: https://broker.mjsec.kr/api
    description: Production HTTPS gateway
tags:
  - name: Runtime k3s credentials
security:
  - RuntimeBearer: []
paths:
  /v1/runtime/k3s-credentials:
    get:
      tags:
        - Runtime k3s credentials
      operationId: listRuntimeK3sCredentials
      summary: List Runtime-visible k3s credentials
      description: >-
        Returns credentials for enabled, non-retired resource targets. Follow
        next_cursor until it is null when more than one page is available.
      parameters:
        - name: after
          in: query
          required: false
          description: Cursor returned as next_cursor by the previous page.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Maximum number of credentials to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: Credential page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeK3sCredentialList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/BrokerInternalError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
  /v1/runtime/k3s-credentials/{resource_target_id}:
    get:
      tags:
        - Runtime k3s credentials
      operationId: getRuntimeK3sCredential
      summary: Get one resource target's k3s credential
      description: >-
        Use the Scheduler reservation response's candidate_id as
        resource_target_id. The reservation target_id is a Kubernetes Node UID
        and is not valid for this path.
      parameters:
        - name: resource_target_id
          in: path
          required: true
          description: Broker resource target UUID (Scheduler candidate_id).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest k3s credential for the resource target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeK3sCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No Runtime-visible credential exists for this target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: K3S_CREDENTIAL_NOT_FOUND
                  message: The k3s credential was not found.
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/BrokerInternalError"
        "503":
          $ref: "#/components/responses/BrokerUnavailable"
components:
  securitySchemes:
    RuntimeBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Fixed RUNTIME_API_TOKEN shared only by Broker and the single trusted
        Runtime. It must contain at least 32 characters and must differ from
        Admin and Scheduler tokens.
  schemas:
    RuntimeK3sCredential:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - resource_target_id
        - target_id
        - source_bootstrap_job_id
        - server_url
        - kubeconfig_base64
        - client_certificate_fingerprint_sha256
        - client_certificate_not_after
        - generated_at
        - uploaded_at
      properties:
        schema_version:
          type: integer
          const: 1
        resource_target_id:
          type: string
          format: uuid
        target_id:
          type: [string, "null"]
          minLength: 1
          description: >-
            Current observed Kubernetes Node UID, matching Scheduler lifecycle
            target_id. Verify against the credential's cluster before registering
            this as Runtime's target key. Null until a Kubernetes node is observed;
            never substitute resource_target_id. Credential paths and cursors
            continue to use resource_target_id.
        source_bootstrap_job_id:
          type: string
          format: uuid
        server_url:
          type: string
          format: uri
          description: Kubernetes API URL reachable by Runtime on TCP 6443.
          example: https://192.0.2.10:6443
        kubeconfig_base64:
          type: string
          format: byte
          description: >-
            Base64-encoded kubeconfig YAML containing the cluster CA, client
            certificate, and private key. This is sensitive plaintext after
            Base64 decoding.
        client_certificate_fingerprint_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        client_certificate_not_after:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        uploaded_at:
          type: string
          format: date-time
    RuntimeK3sCredentialList:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeK3sCredential"
        next_cursor:
          oneOf:
            - type: string
              format: uuid
            - type: "null"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ValidationErrorItem:
      type: object
      required:
        - type
        - loc
        - msg
      properties:
        type:
          type: string
        loc:
          type: array
          items: {}
        msg:
          type: string
        input: {}
        ctx:
          type: object
          additionalProperties: true
    ValidationErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"
  responses:
    Unauthorized:
      description: Runtime Bearer token is missing or invalid
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingToken:
              value:
                error:
                  code: RUNTIME_TOKEN_REQUIRED
                  message: A valid Runtime Bearer token is required.
            invalidToken:
              value:
                error:
                  code: INVALID_RUNTIME_TOKEN
                  message: The Runtime token is invalid.
    ValidationError:
      description: Path or query validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    BrokerInternalError:
      description: Database or stored credential decryption failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            decryptionFailed:
              value:
                error:
                  code: K3S_CREDENTIAL_DECRYPTION_FAILED
                  message: A stored k3s credential could not be decrypted.
            databaseError:
              value:
                error:
                  code: DATABASE_ERROR
                  message: The k3s credentials could not be loaded.
    BrokerUnavailable:
      description: Runtime authentication or credential storage is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            authNotConfigured:
              value:
                error:
                  code: RUNTIME_AUTH_NOT_CONFIGURED
                  message: Runtime authentication is not configured.
            storageNotConfigured:
              value:
                error:
                  code: K3S_CREDENTIAL_STORAGE_NOT_CONFIGURED
                  message: k3s credential storage is not configured.
