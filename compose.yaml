x-broker-image: &broker-image
  image: msg-resource-broker:dev
  build:
    context: .

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broker}
      POSTGRES_USER: ${POSTGRES_USER:-broker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broker-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U ${POSTGRES_USER:-broker}
          -d ${POSTGRES_DB:-broker}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *broker-image
    environment:
      DATABASE_URL: >-
        ${DATABASE_URL:-postgresql+psycopg://broker:broker-local-password@db:5432/broker}
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *broker-image
    environment:
      DATABASE_URL: >-
        ${DATABASE_URL:-postgresql+psycopg://broker:broker-local-password@db:5432/broker}
    ports:
      - "${BROKER_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: msg-broker-admin:dev
    build:
      context: ./frontend
    environment:
      VITE_PROXY_TARGET: http://app:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:5173
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
