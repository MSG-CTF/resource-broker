x-broker-image: &broker-image
  image: ${BROKER_IMAGE:-msg-resource-broker:latest}
  build:
    context: .

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broker}
      POSTGRES_USER: ${POSTGRES_USER:-broker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U ${POSTGRES_USER:-broker}
          -d ${POSTGRES_DB:-broker}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  migrate:
    <<: *broker-image
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  app:
    <<: *broker-image
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ADMIN_ID: ${ADMIN_ID:?Set ADMIN_ID in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:?Set ADMIN_TOKEN_SECRET in .env}
      ADMIN_TOKEN_TTL_SECONDS: ${ADMIN_TOKEN_TTL_SECONDS:-28800}
      SCHEDULER_API_TOKEN: ${SCHEDULER_API_TOKEN:?Set SCHEDULER_API_TOKEN in .env}
      SCHEDULER_OBSERVATION_STALE_SECONDS: ${SCHEDULER_OBSERVATION_STALE_SECONDS:-600}
      SCHEDULER_CANDIDATE_VALIDITY_SECONDS: ${SCHEDULER_CANDIDATE_VALIDITY_SECONDS:-30}
      SCHEDULER_RESERVATION_TTL_SECONDS: ${SCHEDULER_RESERVATION_TTL_SECONDS:-120}
      BOOTSTRAP_ARTIFACT_DIR: /srv/broker/bootstrap-artifacts
      BOOTSTRAP_PUBLIC_BASE_URL: ${BOOTSTRAP_PUBLIC_BASE_URL:-https://agents.mjsec.kr}
      BOOTSTRAP_JOB_TIMEOUT_SECONDS: ${BOOTSTRAP_JOB_TIMEOUT_SECONDS:-7200}
      BOOTSTRAP_JOB_POLL_SECONDS: ${BOOTSTRAP_JOB_POLL_SECONDS:-10}
      BOOTSTRAP_GCP_MAX_ACTIVE_ASSIGNMENTS_PER_ZONE: ${BOOTSTRAP_GCP_MAX_ACTIVE_ASSIGNMENTS_PER_ZONE:-10}
      AWS_FEDERATION_HUB_ROLE_ARN: ${AWS_FEDERATION_HUB_ROLE_ARN:-}
      AWS_FEDERATION_AUDIENCE: ${AWS_FEDERATION_AUDIENCE:-}
      AWS_STS_REGION: ${AWS_STS_REGION:-us-east-1}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-msg-broker-admin:latest}
    build:
      context: ./frontend
    ports:
      - >-
        ${BROKER_HTTP_BIND_ADDRESS:-127.0.0.1}:${BROKER_HTTP_PORT:-8080}:80
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
