[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-resource-broker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.136,<1",
    "google-cloud-compute>=1,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.44,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
